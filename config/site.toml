# ページの文言（4言語）。ページは毎日 scripts/build_site.py で作り直す。
# 店・分類の名前は docs/spec.md の表と同じ。タグの名前は config/tags.toml。
# 言語のキー: ja（日本語）・ko（韓国語）・zh（繁体字・台湾。URL は zh-tw）・en（英語。それ以外の言語の人も）

[site]
url = "https://uniiqcode.com/konbini-24h/"      # 正式な URL（seo-uniiqcode スキル）
goatcounter = "https://konbini24h.goatcounter.com"
count_from = "2026-11-08"                        # 訪問者数を数え始めた日
category_page_min = 10                           # 分類のページを作る本数（これ以上ある分類だけ）
slides = ["tokyo", "kyoto", "fuji", "slope"]     # 背景のスライドショーの順
# 人物が左寄りの絵は、スマホで見せる位置を左に寄せる（CSS の object-position の横の値）
slide_position = { tokyo = "50%", kyoto = "30%", fuji = "50%", slope = "28%" }

[lang.ja]
path = "ja"
html_lang = "ja"
hreflang = "ja"
og_locale = "ja_JP"
name = "日本語"
