# 載せる基準と、キーワードによる判定・分類。AI は使わない。
# 判定はタイトルと概要欄の文字で行う。大文字・小文字は区別しない。

[buzz]
days = 90             # 投稿から何日以内か
min_views = 300000    # 再生数がいくつ以上か（2026-11-07 に10万から上げた。食品中心できつめに絞るため）
max_seconds = 180     # ショートとみなす長さ（今の YouTube ショートの上限）
food_only = true      # 食品の分類だけ載せる（食品以外・未分類は載せない）
per_channel = 5       # 1つのチャンネルから載せる本数の上限（再生数の多い順に残す）

# ---- 店 ----
# どれか1社だけ当たればその店。2社以上、またはどの店名もなく「コンビニ」だけなら「全店」。
[stores.seven]
words = ["セブンイレブン", "セブン-イレブン", "セブン‐イレブン", "セブン", "7-eleven", "7eleven", "7 eleven",
         "seven eleven", "seven-eleven", "7-11", "7/11", "711", "세븐일레븐", "세븐", "小七", "เซเว่น"]

[stores.familymart]
words = ["ファミリーマート", "ファミマ", "ファミチキ", "familymart", "family mart", "famima", "famichiki",
         "패밀리마트", "패마", "全家", "แฟมิลี่มาร์ท"]

[stores.lawson]
words = ["ローソン", "からあげクン", "lawson", "로손", "羅森", "罗森", "ลอว์สัน"]

[stores.any]
# 店名がなくても「日本のコンビニ」の動画なら全店にする
words = ["コンビニ", "konbini", "conbini", "combini", "convenience store", "편의점", "便利商店", "便利店",
         "超商", "ร้านสะดวกซื้อ", "tiện lợi", "minimarket", "supérette", "tienda de conveniencia",
         "loja de conveniência", "kombini"]

# ---- 日本の動画か ----
# 7-Eleven・FamilyMart は韓国・台湾・タイにもあるので、日本の話だと分かるものだけ載せる。
# タイトルか概要欄に下の言葉がある、またはタイトルにかなが入っていれば日本の動画とみなす。
[japan]
words = ["japan", "japanese", "japon", "japón", "japão", "jepang", "giappone", "nhật", "日本", "일본",
         "ญี่ปุ่น", "tokyo", "osaka", "kyoto", "東京", "大阪", "京都", "도쿄", "오사카", "konbini", "conbini"]

# ---- 載せないもの ----
[exclude]
# ほかの店・ほかの国のコンビニの話（タイトルに当たれば外す。3社の名前が一緒にあれば外さない）
other_stores = ["gs25", "cu편의점", "이마트24", "emart24", "ministop", "ミニストップ", "セイコーマート", "seicomart",
                "デイリーヤマザキ", "ok mart", "萊爾富", "hi-life", "全聯"]
# 店の公式チャンネル（ほぼ広告なので載せない）。チャンネル名で完全に一致させる
official_channels = ["ローソン（LAWSON)", "ローソン（LAWSON）", "セブン‐イレブン・ジャパン", "セブン-イレブン・ジャパン", "ファミリーマート", "FamilyMart"]
# コンビニと関係のない動画によく出る言葉
# 「PR」は広告の表記（タイトルに #PR・【PR】 など。英数字の言葉なので単語の境目で当てる）
words = ["pr", "広告", "robbery", "강도", "強盗", "prank", "몰카", "ドッキリ", "hair", "capelli", "taiwan", "台灣", "台湾", "한국 편의점", "雀巢", "racially", "attacked", "firstpost"]

