# 動画の中身を、視聴者の言語の「単語」で紹介するためのタグ。
# 動画タイトルは翻訳しない（元の言語のまま出す）。タイトル（ハッシュタグを含む）に words のどれかがあれば、
# そのタグを label の言語で出す。AI・翻訳の API は使わない。
# 1本に出すのは、items（もの）から2つ・formats（内容）から1つまで。上にあるものほど先に出す。
# skip_if: そこに書いたタグも当たった時は、このタグを出さない。
# label は ja（日本語）・ko（韓国語）・zh（繁体字）・en（英語）。

