<!doctype html>
<html lang="__HTML_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
__HEAD__
<meta name="theme-color" content="#14202E">
<link rel="icon" href="__BASE__assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="__BASE__assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="__BASE__assets/apple-touch-icon.png">
<link rel="manifest" href="__BASE__manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="KONBINI 24H">
<style>
/* 値札の黄色（からし色）と墨色。ページ上部は写真のスライドショー、その下に棚のレールのような絞り込み、2列の動画 */
:root {
  --paper: #F6F5F0; --card: #FFFFFF; --ink: #1C2127; --muted: #5E6670; --line: #DEDCD3;
  --tag: #E5B000; --tag-ink: #1C2127; --chip: #ECEAE2; --chip-on: #1C2127; --chip-on-ink: #FFFFFF;
  --night: #14202E;
  --body: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Apple SD Gothic Neo", "Noto Sans KR", "PingFang TC", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #15181C; --card: #1E2228; --ink: #EEF0F2; --muted: #A3AAB3; --line: #2E333A;
    --chip: #262B32; --chip-on: #E5B000; --chip-on-ink: #1C2127; color-scheme: dark }
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5 }
a { color: inherit }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* ページ上部: 写真のスライドショー */
.hero { position: relative; background: var(--night); color: #fff; overflow: hidden }
.slides { position: relative; aspect-ratio: 3 / 2; max-height: 72vh; width: 100%; margin: 0 auto }
@media (max-width: 700px) { .slides { aspect-ratio: 1 / 1; max-height: 64vh } }
.slide { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity 1.2s ease }
.slide.on { opacity: 1 }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block }
.slide figcaption { position: absolute; z-index: 1; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 54px); max-width: calc(100% - 64px);
  font-weight: 700; font-size: clamp(14px, 3.4vw, 18px); text-shadow: 0 1px 6px rgba(0,0,0,.8);
  background: rgba(8,12,20,.35); padding: 3px 10px; border-radius: 4px }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(8,12,20,.45) 0%, rgba(8,12,20,0) 22%, rgba(8,12,20,0) 52%, rgba(8,12,20,.85) 100%) }
.topbar { position: absolute; z-index: 2; left: 0; right: 0; top: 0; display: flex; justify-content: flex-end;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)) }
.langs { display: flex; gap: 2px; background: rgba(0,0,0,.35); border-radius: 999px; padding: 3px }
.langs a { color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap }
.langs a[aria-current] { background: var(--tag); color: var(--tag-ink) }
.brand { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 14px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); max-width: 720px; margin: 0 auto }
.brand .logo { width: clamp(120px, 30vw, 180px); height: auto; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)) }
.brand h1 { margin: 0; font-size: clamp(18px, 4.6vw, 26px); line-height: 1.25; text-wrap: balance; text-shadow: 0 1px 4px rgba(0,0,0,.6) }
.brand p { margin: 4px 0 0; font-size: 13px; opacity: .92; text-shadow: 0 1px 4px rgba(0,0,0,.6) }
.dots { position: absolute; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 92px); display: flex; flex-direction: column; gap: 8px }
.dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.45); cursor: pointer }
.dots button[aria-current] { background: var(--tag) }

/* 絞り込み（スクロールしても上に残る） */
.rail { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); padding-block: 8px }
.rail .wrap { display: grid; gap: 8px }
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px }
.row::-webkit-scrollbar { display: none }
.chip { flex: none; border: 0; background: var(--chip); color: var(--ink); font: 600 13px var(--body); padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; text-decoration: none }
.chip[aria-pressed="true"], .chip[aria-current] { background: var(--chip-on); color: var(--chip-on-ink) }
.chip.store { border-radius: 6px }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.seg { display: flex; background: var(--chip); border-radius: 8px; padding: 3px }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 12px var(--body); padding: 5px 10px; border-radius: 6px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* 動画の一覧 */
.back { margin: 14px 0 0; font-size: 13px }
.grid { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.card { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.card > a { text-decoration: none; display: flex; flex-direction: column; gap: 6px }
.thumb { position: relative; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: var(--chip) }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.lb { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.6); color: #fff; font: 700 10px var(--body); padding: 2px 6px; border-radius: 4px; letter-spacing: .04em }
.tag { position: absolute; left: 8px; bottom: 8px; background: var(--tag); color: var(--tag-ink); font: 700 13px var(--body); font-variant-numeric: tabular-nums;
  padding: 3px 8px 3px 14px; border-radius: 3px 6px 6px 3px; clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%) }
.title { margin: 0; font-size: 13.5px; line-height: 1.4; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere }
.tags { display: flex; flex-wrap: wrap; gap: 4px }
.tags span { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--chip); white-space: nowrap }
.tags span.f { background: transparent; border: 1px solid var(--line); color: var(--muted) }
.meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; min-width: 0 }
.meta span, .meta time { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.empty { color: var(--muted); text-align: center; padding: 40px 0 }

/* ページの最後 */
.pages { margin-top: 32px }
.pages h2 { font-size: 15px; margin: 0 0 8px }
.pages ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px }
.pages a { display: block; padding: 6px 12px; border-radius: 6px; background: var(--chip); text-decoration: none; font-size: 13px; font-weight: 600 }
footer { margin-top: 28px; padding-block: 14px 40px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted) }
footer p { margin: 4px 0 }
.visitors { margin: 0 0 14px; color: var(--ink) }
.visitors p { font-weight: 700; margin: 0 0 6px }
.countries { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted) }
.countries b { color: var(--ink); font-variant-numeric: tabular-nums }
button:focus-visible, a:focus-visible { outline: 2px solid var(--tag); outline-offset: 2px }
@media (prefers-reduced-motion: reduce) { .slide { transition: none } }
</style>
<script data-goatcounter="__GOATCOUNTER__/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="hero">
  <div class="slides" id="slides">__SLIDES__</div>
  <div class="topbar"><nav class="langs" aria-label="__LANG_LABEL__">__LANGS__</nav></div>
  <div class="dots" id="dots">__DOTS__</div>
  <div class="brand">
    <img class="logo" src="__BASE__assets/logo-a.svg" alt="__SITE_NAME__" width="320" height="150">
    <div><h1>__H1__</h1><p>__LEAD__</p></div>
  </div>
</header>

<div class="rail">
  <div class="wrap">
    <nav class="row" aria-label="__STORE_LABEL__">__STORES__</nav>
    <div class="row" id="cats" role="group" aria-label="__CAT_LABEL__"__CATS_HIDDEN__>__CATS__</div>
    <div class="bar">
      <div class="seg" id="sort" role="group"><button type="button" data-s="new" aria-pressed="true">__SORT_NEW__</button><button type="button" data-s="views" aria-pressed="false">__SORT_VIEWS__</button></div>
      <span class="count" id="count">__COUNT__</span>
    </div>
  </div>
</div>

<main class="wrap">
  __BACK__
  <ul class="grid" id="grid">
__CARDS__
  </ul>
  <p class="empty" id="empty" hidden>__EMPTY__</p>
  __PAGES__
</main>

<footer class="wrap">
  __VISITORS__
  <p>__UPDATED__</p>
  __FOOTER__
</footer>

<script>
(function () {
  "use strict";
  var T = __I18N__;
  var grid = document.getElementById("grid");
  var cards = Array.prototype.slice.call(grid.children);
  var state = { k: "", sort: "new" };   // 最初は新しい順（開くたびに新しい動画が目に入るように）

  // 選んだ言語を覚える（一番上のページの振り分けで使う）
  document.querySelectorAll(".langs a").forEach(function (a) {
    a.addEventListener("click", function () { try { localStorage.setItem("k24-lang", a.dataset.lang); } catch (e) {} });
  });
  try { localStorage.setItem("k24-lang", T.path); } catch (e) {}

  // 何日前か（ページは毎日作り直すが、見ている日に合わせて書き直す）
  var today = new Date(); today.setHours(0, 0, 0, 0);
  cards.forEach(function (c) {
    var t = c.querySelector("time");
    var d = new Date(c.dataset.d + "T00:00:00");
    var n = Math.max(0, Math.round((today - d) / 864e5));
    t.textContent = n < 1 ? T.ago_today : T.ago_days.replace("{d}", n);
  });

  function apply() {
    var shown = cards.filter(function (c) { return !state.k || c.dataset.k === state.k; });
    shown.sort(state.sort === "views"
      ? function (a, b) { return b.dataset.v - a.dataset.v; }
      : function (a, b) { return a.dataset.d < b.dataset.d ? 1 : a.dataset.d > b.dataset.d ? -1 : b.dataset.v - a.dataset.v; });
    cards.forEach(function (c) { c.hidden = true; });
    shown.forEach(function (c) { c.hidden = false; grid.appendChild(c); });
    document.getElementById("count").textContent = T.count.replace("{n}", shown.length);
    document.getElementById("empty").hidden = shown.length > 0;
  }
  function press(group, btn) {
    group.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
  }
  var cats = document.getElementById("cats");
  cats.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    state.k = b.dataset.k; press(cats, b); apply();
  });
  var sort = document.getElementById("sort");
  sort.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    state.sort = b.dataset.s; press(sort, b); apply();
  });

  // 訪問者の国の名前を、見ている人の言語で
  if (window.Intl && Intl.DisplayNames) {
    try {
      var dn = new Intl.DisplayNames([T.lang], { type: "region" });
      document.querySelectorAll(".countries li[data-cc]").forEach(function (li) {
        var n = dn.of(li.dataset.cc); if (n) li.querySelector(".cn").textContent = n;
      });
    } catch (e) {}
  }

  // 背景のスライドショー: 6秒ごとに切り替え。動きを減らす設定では自動で切り替えない（点を押すか、左右に払う）
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var dots = Array.prototype.slice.call(document.querySelectorAll("#dots button"));
  var cur = 0, timer = null;
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function load(i) {
    var s = slides[i]; if (!s) return;
    s.querySelectorAll("[data-src]").forEach(function (el) { el.src = el.dataset.src; el.removeAttribute("data-src"); });
    s.querySelectorAll("[data-srcset]").forEach(function (el) { el.srcset = el.dataset.srcset; el.removeAttribute("data-srcset"); });
  }
  function show(i) {
    cur = (i + slides.length) % slides.length;
    load(cur); load((cur + 1) % slides.length);
    slides.forEach(function (s, j) { s.classList.toggle("on", j === cur); });
    dots.forEach(function (d, j) { if (j === cur) d.setAttribute("aria-current", "true"); else d.removeAttribute("aria-current"); });
  }
  function start() { if (!still && !timer) timer = setInterval(function () { show(cur + 1); }, 6000); }
  function stop() { clearInterval(timer); timer = null; }
  dots.forEach(function (d, j) { d.addEventListener("click", function () { stop(); show(j); start(); }); });
  var x0 = null, box = document.getElementById("slides");
  box.addEventListener("touchstart", function (ev) { x0 = ev.touches[0].clientX; }, { passive: true });
  box.addEventListener("touchend", function (ev) {
    if (x0 === null) return;
    var dx = ev.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { stop(); show(cur + (dx < 0 ? 1 : -1)); start(); }
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else start(); });
  window.addEventListener("load", function () { load(1); });
  start();
})();
</script>
</body>
</html>
